name: cc_core
description: "Shared core library for Code Cowboys apps — privacy-first, local-only journal/log building blocks."
version: 0.13.0
repository: https://github.com/Mark-Code-Cowboys/cc_core
publish_to: none

environment:
  # Matches TableEncore's floor — the module came out of it and every
  # consumer builds with the same local SDK (Dart 3.12.2).
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  # io backup archive (zip build/read), same version Table Encore ships.
  archive: ^4.0.9
  # journal module: shared Drift table definitions + generic repository.
  drift: ^2.34.3
  flutter:
    sdk: flutter
  # scan module: on-device capture + OCR, same versions Table Encore
  # already ships (the module was extracted from it).
  google_mlkit_document_scanner: ^0.6.1
  google_mlkit_text_recognition: ^0.17.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  icloud_storage: ^2.2.0
  # journal photo store (capture/pick), same version both apps ship.
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.0
  # For GooglePlayProductDetails: base-plan selection on multi-plan
  # subscriptions. Pure-Dart wrappers; safe to import on every platform.
  in_app_purchase_android: ^0.5.2
  shared_preferences: ^2.5.5
  stream_transform: ^2.1.1

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

